name: Release

# Push a tag like v0.2.0 to publish a GitHub release with:
#   Plexi-<version>-setup.exe      per-user installer (no admin), Start menu, .plexi files, optional autostart
#   Plexi-<version>-x64.msi        all-users MSI for managed machines
#   Plexi-<version>-portable.exe   single exe; keeps its data in a PlexiData folder beside it
#   Plexi-<version>-portable.zip   the same, unpacked into a Plexi folder
#   Plexi-<version>-macos.dmg      Plexi.app (Apple silicon + Intel), drag to Applications
#   Plexi-<version>-macos.zip      the same app, zipped
#   SHA256SUMS.txt
# Running the workflow by hand builds everything and attaches it as a workflow artifact instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $v = ($meta.packages | Where-Object name -eq 'plexi').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p plexi

      - name: Smoke test the release exe
        shell: pwsh
        run: |
          # plexi.exe is a GUI-subsystem app, so the shell does not wait for it by itself.
          cargo run -q -p plexi-core --example demo -- demo.plexi
          $p = Start-Process ./target/release/plexi.exe -ArgumentList 'export', 'demo.plexi', 'demo.pdf' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -or -not (Test-Path demo.pdf)) { throw "export failed ($($p.ExitCode))" }
          (Get-Item demo.pdf).Length

      - name: Portable builds
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist, pkg/Plexi | Out-Null
          Copy-Item target/release/plexi.exe "dist/Plexi-$v-portable.exe"
          Copy-Item target/release/plexi.exe pkg/Plexi/plexi.exe
          Copy-Item LICENSE pkg/Plexi/LICENSE.txt
          Set-Content pkg/Plexi/plexi-portable "Plexi keeps its settings and notes in the PlexiData folder next to plexi.exe while this file exists."
          Compress-Archive -Path pkg/Plexi -DestinationPath "dist/Plexi-$v-portable.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $root = (Get-Location).Path
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceExe=$root\target\release\plexi.exe" "/O$root\dist" installer\plexi.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (-not (Test-Path "dist/Plexi-${{ steps.version.outputs.version }}-setup.exe")) { throw "installer missing" }

      - name: MSI (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build installer/plexi.wxs -arch x64 -d "Version=${{ steps.version.outputs.version }}" -d SourceExe=target/release/plexi.exe -o "dist/Plexi-${{ steps.version.outputs.version }}-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix failed" }
          Remove-Item dist/*.wixpdb -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: plexi-windows
          path: dist/*

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "plexi"))')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --workspace

      - name: Build (Apple silicon and Intel)
        run: |
          cargo build --release -p plexi --target aarch64-apple-darwin
          cargo build --release -p plexi --target x86_64-apple-darwin

      - name: Smoke test
        run: |
          cargo run -q -p plexi-core --example demo -- demo.plexi
          ./target/aarch64-apple-darwin/release/plexi export demo.plexi demo.pdf
          test -s demo.pdf && ls -l demo.pdf

      - name: App bundle, zip and dmg
        run: |
          v="${{ steps.version.outputs.version }}"
          app=pkg/Plexi.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" pkg/plexi.iconset dist
          lipo -create -output "$app/Contents/MacOS/plexi"             target/aarch64-apple-darwin/release/plexi target/x86_64-apple-darwin/release/plexi
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/plexi-1024.png --out "pkg/plexi.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s * 2)) $((s * 2)) assets/plexi-1024.png --out "pkg/plexi.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns pkg/plexi.iconset -o "$app/Contents/Resources/plexi.icns"
          sed "s/@VERSION@/$v/g" installer/Info.plist > "$app/Contents/Info.plist"
          cp LICENSE "$app/Contents/Resources/LICENSE.txt"
          # Ad-hoc signature: required to run on Apple silicon. Not notarized.
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          ditto -c -k --keepParent "$app" "dist/Plexi-$v-macos.zip"
          mkdir -p pkg/dmg
          cp -R "$app" pkg/dmg/
          ln -s /Applications pkg/dmg/Applications
          hdiutil create -volname "Plexi $v" -srcfolder pkg/dmg -ov -format UDZO "dist/Plexi-$v-macos.dmg"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: plexi-macos
          path: dist/*

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: plexi-${{ needs.windows.outputs.version }}
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Which download?**
            - `Plexi-${{ needs.windows.outputs.version }}-setup.exe` — Windows installer. No admin needed; adds Start menu entries, opens `.plexi` files, and can start Plexi with Windows.
            - `Plexi-${{ needs.windows.outputs.version }}-portable.exe` — Windows, nothing to install. Keeps its settings and autosaves in a `PlexiData` folder next to the exe.
            - `Plexi-${{ needs.windows.outputs.version }}-portable.zip` — the portable Windows build in a folder, for USB sticks.
            - `Plexi-${{ needs.windows.outputs.version }}-x64.msi` — all-users MSI for managed PCs.
            - `Plexi-${{ needs.windows.outputs.version }}-macos.dmg` — macOS 11+ (Apple silicon and Intel). Open it and drag Plexi to Applications.
            - `Plexi-${{ needs.windows.outputs.version }}-macos.zip` — the same Mac app, zipped.

            Builds are not code-signed yet. On Windows, SmartScreen may warn on first run ("More info" → "Run anyway"). On a Mac, right-click Plexi → Open the first time (or allow it under System Settings → Privacy & Security). Screenshots from draw-on-screen mode need Screen Recording permission on macOS.
