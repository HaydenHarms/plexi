[workspace]
resolver = "2"
members = ["crates/plexi-core", "crates/plexi"]

[workspace.package]
version = "0.8.1"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/HaydenHarms/plexi"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
