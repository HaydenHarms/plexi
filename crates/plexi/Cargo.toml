[package]
name = "plexi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Draw and take notes anywhere, right on top of your screen"

[dependencies]
directories = "6.0.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
egui = "0.37.0"
env_logger = "0.11.11"
global-hotkey = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.35"
plexi-core = { path = "../plexi-core" }
raw-window-handle = { version = "0.6", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tray-icon = "0.26.1"
ureq = "3.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
xcap = { version = "0.9.8", default-features = false }

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Com"] }

[build-dependencies]
embed-resource = "3.0.12"
